# lid-guard configuration.
#
# See the effect with:  lid-guard --list
# Apply changes with:   sudo systemctl restart lid-guard

[devices]
# Extra devices to block while the lid is closed. A device matches if its name, as shown
# by `lid-guard --list`, contains the text. One per line, indented. Useful for built-in
# keyboards that show up as USB devices, for example:
#
# include =
#     ASUSTeK Computer Inc. N-KEY Device
include =

# Devices to never block, even if they look built-in. Same format as include.
exclude =

[screen]
# Turn off the backlight of the built-in screen while the lid is closed.
backlight = yes
