name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: ShellCheck
        run: shellcheck src/sveglio install.sh uninstall.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Unit tests
        run: pytest -v
      - name: Command-line smoke test
        run: |
          python src/lid_guard.py --version
          python src/lid_guard.py --list --config config/lid-guard.conf \
            --devices tests/fixtures/asus-expertbook-ultra-b9406caa.txt
          bash src/sveglio --help
